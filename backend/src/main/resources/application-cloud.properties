spring.ai.model.embedding=transformers
spring.ai.embedding.transformer.onnx.model-uri=https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/model.onnx
spring.ai.embedding.transformer.tokenizer.uri=https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/tokenizer.json
spring.ai.vectorstore.pgvector.dimensions=384

spring.datasource.url=jdbc:postgresql://${PG_DB_HOST}:${PG_DB_PORT}/${PG_DB_NAME}?sslmode=require
spring.datasource.username=${PG_DB_USER}
spring.datasource.password=${PG_DB_PASSWORD}

logging.level.org.springframework.ai=INFO
logging.level.org.springframework.web=INFO